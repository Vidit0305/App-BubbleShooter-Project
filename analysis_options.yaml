# Static analysis for the Bubble Shooter project.
# Run with: flutter analyze
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Consistency
    - directives_ordering
    - prefer_single_quotes
    - always_declare_return_types
    - sort_child_properties_last
    # Safety
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - avoid_void_async
    # Clarity
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - use_named_constants
